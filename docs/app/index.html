  <style>
    :root {
      --bg-top: #fdf8ef;
      --bg-bot: #f5ead6;
      --card: #ffffff;
      --card-2: #f7f0e3;
      --border: #e7dcc7;
      --text: #231d33;
      --muted: #6c6578;
      --brand: #7c3aed;     /* electric violet — primary actions + countdown */
      --brand-2: #9d4bff;
      --hblr: #fb7185;      /* coral — Hudson-Bergen Light Rail */
      --path: #3b82f6;      /* blue — PATH */
      --success: #14b8a6;   /* bright teal — successful connections */
      --comfy: #14b8a6;
      --soon: #f59e0b;
      --go: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      line-height: 1.5;
      background: radial-gradient(1200px 600px at 50% -10%, #fffdf8 0%, var(--bg-top) 45%, var(--bg-bot) 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 80px; }

    /* Brand */
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 4px; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px; flex: none;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      display: grid; place-items: center; font-weight: 900; color: #fff; font-size: 20px;
      box-shadow: 0 6px 18px rgba(99,102,241,.35);
    }
    h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
    .tagline { color: var(--muted); font-size: 14px; margin: 0 0 10px 51px; }
    .mock-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11.5px; color: #0f766e; background: rgba(20,184,166,0.12);
      border: 1px solid rgba(20,184,166,0.35); padding: 3px 10px; border-radius: 999px;
      margin: 0 0 20px 51px;
    }
    .mock-pill::before { content: "●"; color: var(--success); font-size: 9px; }

    .hint { color: var(--muted); font-size: 14px; margin: 6px 0; }

    /* ===== Top bar (featured-journey chrome) ===== */
    #dashboard { margin-bottom: 12px; }
    .top-bar { display: flex; gap: 10px; }
    .pill-btn {
      display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
      font-size: 14px; font-weight: 700; color: #fff; border: none; border-radius: 999px;
      padding: 10px 16px; background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 4px 14px rgba(124,58,237,.28);
    }
    .pill-btn.ghost { background: #fff; color: var(--brand); border: 1px solid var(--border); box-shadow: none; }
    .pill-ic { font-size: 15px; }
    .featured-label { font-size: 12.5px; color: var(--muted); margin: 10px 2px 0; }
    .featured-label strong { color: var(--text); }

    /* ===== Countdown (centerpiece) ===== */
    #countdown { margin-bottom: 18px; }
    .cd-card {
      border-radius: 22px; padding: 18px 18px 14px; text-align: center;
      border: 1px solid var(--border); position: relative; overflow: hidden;
      transition: background .4s ease, box-shadow .4s ease;
    }
    .cd-empty { background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 30px 20px; text-align: center; }
    .state-comfy { background: linear-gradient(165deg, rgba(20,184,166,.16), #ffffff 70%); box-shadow: 0 10px 34px rgba(20,184,166,.18); }
    .state-soon  { background: linear-gradient(165deg, rgba(245,158,11,.20), #ffffff 70%); box-shadow: 0 10px 34px rgba(245,158,11,.20); }
    .state-go    { background: linear-gradient(165deg, rgba(239,68,68,.22), #ffffff 72%); box-shadow: 0 10px 40px rgba(239,68,68,.26); animation: pulse 1.1s ease-in-out infinite; }
    .state-none  { background: var(--card); }
    @keyframes pulse { 0%,100% { box-shadow: 0 10px 40px rgba(239,68,68,.25); } 50% { box-shadow: 0 10px 60px rgba(239,68,68,.55); } }

    .cd-leg { font-size: 12px; color: var(--muted); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .cd-op { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; margin: 6px 0 2px; }

    /* At-a-glance journey summary (the few-second read) */
    .jsum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 6px; }
    .jsum-i { background: var(--card-2); border: 1px solid var(--border); border-radius: 12px; padding: 8px 4px; }
    .jsum-hero { background: rgba(124,58,237,.1); border-color: rgba(124,58,237,.3); }
    .jsum-k { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
    .jsum-v { font-size: 17px; font-weight: 800; color: var(--text); margin-top: 2px; }
    .jsum-hero .jsum-v { color: var(--brand); }
    .jsum-u { font-size: 10px; font-weight: 700; color: var(--muted); margin-left: 2px; }
    .jsum-early { color: var(--success); font-size: 13px; }
    @media (max-width: 380px) { .jsum { grid-template-columns: repeat(2, 1fr); } }
    .cd-op-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--op, var(--brand)); box-shadow: 0 0 10px var(--op, var(--brand)); }
    .cd-headline { font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin: 2px 0 0; }
    .state-comfy .cd-headline { color: #0f766e; }
    .state-soon  .cd-headline { color: #b45309; }
    .state-go    .cd-headline { color: #b91c1c; }
    .cd-timer {
      font-size: 76px; line-height: 1.02; font-weight: 900; letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums; margin: 2px 0 4px; color: var(--brand);
      text-shadow: 0 2px 22px rgba(124,58,237,.18);
    }
    @media (min-width: 420px) { .cd-timer { font-size: 88px; } }
    /* Longer h:mm:ss countdowns shrink so they never overflow the card. */
    .cd-timer.long { font-size: 50px; }
    @media (min-width: 420px) { .cd-timer.long { font-size: 58px; } }
    .cd-sub { font-size: 14px; color: var(--muted); }
    .cd-arr { color: var(--success); font-weight: 700; }
    .tight { font-size: 10px; font-weight: 800; color: #b45309; background: rgba(245,158,11,.16); border: 1px solid rgba(245,158,11,.5); border-radius: 999px; padding: 1px 6px; text-transform: uppercase; letter-spacing: .03em; }

    /* Collapsible trip details */
    .cd-more { margin: 10px auto 2px; max-width: 360px; text-align: left; border-top: 1px solid var(--border); padding-top: 8px; }
    .cd-more > summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--brand); list-style: none; text-align: center; }
    .cd-more > summary::-webkit-details-marker { display: none; }
    .cd-more[open] > summary { margin-bottom: 6px; }
    .cd-foot { display: flex; gap: 14px; justify-content: center; margin-top: 10px; }
    .cd-sub strong { color: var(--text); }
    .mock-chip {
      font-size: 9px; font-weight: 800; letter-spacing: .06em; vertical-align: middle;
      color: #c7f9ff; background: rgba(34,211,238,.16); border: 1px solid rgba(34,211,238,.4);
      padding: 1px 6px; border-radius: 999px; margin-left: 4px;
    }
    .live-chip {
      font-size: 9px; font-weight: 800; letter-spacing: .06em; vertical-align: middle;
      color: #bbf7d0; background: rgba(34,197,94,.18); border: 1px solid rgba(34,197,94,.5);
      padding: 1px 6px; border-radius: 999px; margin-left: 4px;
    }
    .sched-chip {
      font-size: 9px; font-weight: 800; letter-spacing: .06em; vertical-align: middle;
      color: #bfdbfe; background: rgba(96,165,250,.18); border: 1px solid rgba(96,165,250,.5);
      padding: 1px 6px; border-radius: 999px; margin-left: 4px;
    }
    /* LIVE / MOCK / UNAVAILABLE status pill */
    .cd-badges { margin: 6px 0 2px; }
    .sched-chip { color: #1e40af !important; background: rgba(59,130,246,.14) !important; border-color: rgba(59,130,246,.5) !important; }
    .live-chip { color: #0f766e !important; background: rgba(20,184,166,.16) !important; border-color: rgba(20,184,166,.5) !important; }
    .mock-chip { color: #0f766e !important; background: rgba(20,184,166,.12) !important; border-color: rgba(20,184,166,.4) !important; }
    .cd-status {
      display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em;
      padding: 3px 10px; border-radius: 999px; text-transform: uppercase;
    }
    .cd-status.live { color: #063; background: #22c55e; }
    .cd-status.mock { color: #0f766e; background: rgba(20,184,166,.12); border: 1px solid rgba(20,184,166,.4); }
    .cd-status.unavailable { color: #b91c1c; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.4); }
    .cd-status.loading { color: #b45309; background: rgba(245,158,11,.14); border: 1px solid rgba(245,158,11,.45); }
    .cd-status.scheduled { color: #1e40af; background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.45); }
    .cd-status.demo { color: #7c2d92; background: rgba(168,85,247,.12); border: 1px solid rgba(168,85,247,.5); }
    .cd-row-transfer .cd-v { color: #0f766e; }
    .cd-buf { opacity: .7; font-size: 11px; }
    .cd-migrate { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .cd-migrate-note { font-size: 11px; color: var(--muted); }
    .cd-next { margin: 6px 0 2px; font-size: 14px; color: var(--brand); font-weight: 600; }
    .cd-row-goal .cd-v { color: #b45309; }
    .cd-edit { margin-top: 8px; }
    .fld-inline { display: flex; gap: 8px; }
    .fld-inline .fld-sub { flex: 1 1 0; display: block; }
    .fld-hint { font-size: 12px; color: var(--muted); margin: -6px 0 14px; }
    .cd-fresh { font-size: 11.5px; color: #0f766e; margin-top: 4px; }

    /* Prominent total-journey time + compact map + full-journey breakdown */
    .cd-total {
      margin: 10px auto 2px; display: inline-block; font-size: 15px; color: var(--text);
      background: rgba(124,58,237,.1); border: 1px solid rgba(124,58,237,.35);
      padding: 7px 14px; border-radius: 999px; font-weight: 600;
    }
    .cd-total strong { color: var(--brand); font-size: 17px; }
    .cd-total-sub { color: var(--success); font-weight: 700; margin-left: 4px; }
    .cd-map { margin: 14px auto 2px; max-width: 360px; background: var(--card-2); border: 1px solid var(--border); border-radius: 16px; padding: 10px 10px 4px; }
    .cd-map-cap { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 2px; }
    .journey-panel { margin: 14px auto 2px; max-width: 360px; text-align: left; background: var(--card-2); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
    .jp-head { font-size: 12px; font-weight: 800; letter-spacing: .03em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
    .jp-sched { color: #1e40af; }
    .jp-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 0; }
    .jp-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--op, var(--brand)); flex: none; }
    .jp-dot.xfer { background: var(--success); }
    .jp-dot.walk { background: #9ca3af; }
    .jp-leg { flex: 1 1 auto; font-weight: 600; }
    .jp-time { color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .jp-time.strong { font-weight: 800; color: var(--brand); }
    .jp-arrow { color: var(--muted); }
    .jp-ride { color: var(--muted); font-size: 11.5px; width: 56px; text-align: right; flex: none; }
    .jp-xfer .jp-leg, .jp-walk .jp-leg { color: var(--muted); font-weight: 600; }
    .jp-sep { height: 1px; background: var(--border); margin: 8px 0; }
    .jp-sum { font-size: 13.5px; }
    .jp-sum .jp-leg { font-weight: 600; }
    .jp-early { color: var(--success); font-weight: 700; }

    .cd-details { margin: 18px auto 4px; max-width: 360px; text-align: left; }
    .cd-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .cd-row:last-child { border-bottom: none; }
    .cd-k { color: var(--muted); font-size: 13.5px; }
    .cd-v { font-weight: 600; font-size: 13.5px; text-align: right; }

    .cd-legs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 14px 0 4px; }
    .leg-pill {
      font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px;
      background: var(--card-2); border: 1px solid var(--border); color: var(--muted);
    }
    .leg-pill.on { background: rgba(124,58,237,.14); border-color: var(--brand); color: var(--brand); }

    .cd-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .cd-note { font-size: 11.5px; color: var(--muted); margin: 14px 0 0; }

    /* Buttons */
    .btn {
      width: 100%; padding: 15px; font-size: 16px; font-weight: 800; color: #fff;
      border: none; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      box-shadow: 0 6px 18px rgba(124,58,237,0.32);
    }
    .btn:active { transform: translateY(1px); }
    .btn-ghost {
      background: transparent; color: var(--brand);
      border: 1px solid var(--border); box-shadow: none;
    }
    .link-btn { background: none; border: none; color: var(--brand); font-weight: 700; font-size: 14px; cursor: pointer; padding: 4px; }
    .link-btn.danger { color: #b91c1c; }

    /* ===== My Commutes / Explore drawer ===== */
    .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .drawer-head h2 { margin: 0; font-size: 19px; }
    .cmx { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
    .cmx.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
    .cmx-main { cursor: pointer; }
    .cmx-name { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .cmx-badge { font-size: 9.5px; font-weight: 800; letter-spacing: .04em; color: #fff; background: var(--brand); padding: 2px 7px; border-radius: 999px; }
    .cmx-badge.live { color: #052e16; background: var(--success); }
    .cmx-route { font-size: 13px; color: var(--text); margin: 5px 0 2px; }
    .cmx-meta { font-size: 12px; color: var(--muted); }
    .cmx-actions { display: flex; gap: 14px; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
    .cmx-confirm { font-size: 13px; color: var(--text); margin-top: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    /* ===== Onboarding sheet ===== */
    #sheet {
      position: fixed; inset: 0; background: rgba(40,30,20,.45); backdrop-filter: blur(3px);
      display: none; align-items: flex-end; justify-content: center; z-index: 50;
    }
    #sheet.open { display: flex; }
    #drawer {
      position: fixed; inset: 0; background: rgba(40,30,20,.45); backdrop-filter: blur(3px);
      display: none; align-items: flex-end; justify-content: center; z-index: 50;
    }
    #drawer.open { display: flex; }
    .sheet-panel {
      width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
      background: var(--bg-top); border: 1px solid var(--border); border-bottom: none;
      border-radius: 22px 22px 0 0; padding: 10px 18px calc(24px + env(safe-area-inset-bottom));
    }
    .sheet-grip { width: 44px; height: 5px; border-radius: 999px; background: var(--border); margin: 6px auto 14px; }
    .sheet-panel h2 { font-size: 19px; margin: 0 0 16px; }
    .fld { display: block; margin-bottom: 14px; }
    .fld-k { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
    .fld input, .fld select {
      width: 100%; padding: 13px 14px; font-size: 15px; color: var(--text);
      border: 1px solid var(--border); border-radius: 12px; background: var(--card-2);
      appearance: none;
    }
    .fld select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%237c3aed' stroke-width='2'><path d='M4 6l4 4 4-4'/></svg>");
      background-repeat: no-repeat; background-position: right 14px center;
    }
    .day-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .day-toggle {
      flex: 1 1 auto; min-width: 42px; padding: 10px 4px; font-size: 13px; font-weight: 700; cursor: pointer;
      background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; color: var(--muted);
    }
    .day-toggle.on { background: rgba(124,58,237,.14); border-color: var(--brand); color: var(--brand); }
    .legs-edit { margin: 4px 0 12px; }
    .leg-edit { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .leg-edit-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; margin-bottom: 10px; }
    .sheet-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }

    /* Welcome screen (Build 4: first-time visitor onboarding) */
    .welcome {
      max-width: 480px; margin: 0 auto; padding: 32px 20px; text-align: center;
    }
    .welcome h1 {
      font-size: 28px; font-weight: 800; margin: 0 0 12px; color: var(--text);
    }
    .welcome-lead {
      font-size: 16px; color: var(--muted); margin: 0 0 28px; line-height: 1.5;
    }
    .welcome-actions {
      display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;
    }
    .welcome-note {
      font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0;
      padding: 16px; background: rgba(124,58,237,.08); border-radius: 12px;
      border: 1px solid rgba(124,58,237,.2);
    }
    .btn-primary {
      background: var(--brand); color: white; font-weight: 700;
    }
    .btn-primary:active { background: #6d28d9; }

    /* Toast notifications */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 20px; font-size: 14px; font-weight: 600; color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 9999;
      opacity: 0; transition: transform .3s, opacity .3s;
      max-width: 90%; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-success { border-color: #10b981; color: #10b981; }
    .toast-error { border-color: #ef4444; color: #ef4444; }
    .toast-info { border-color: var(--brand); color: var(--brand); }

    /* Storage warning */
    .storage-warning {
      max-width: 560px; margin: 0 auto 20px; padding: 14px 16px;
      background: rgba(239,68,68,.1); border: 1px solid #ef4444; border-radius: 12px;
      font-size: 14px; color: #ef4444; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">L</div>
      <h1>LinkWise</h1>
    </div>
    <p class="tagline">Smarter connections, every day.</p>
    <span class="mock-pill">Prototype · real SCHEDULED PATH/HBLR + one LIVE MTA demo (clearly labeled)</span>

    <!-- Dashboard: saved commutes + suggestion + manual switch -->
    <section id="dashboard"></section>

    <!-- Countdown: the centerpiece -->
    <section id="countdown"></section>
  </div>

  <!-- Onboarding sheet -->
  <div id="sheet">
    <div class="sheet-panel">
      <div class="sheet-grip"></div>
      <h2 id="sheetTitle">New commute</h2>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- My Commutes / Explore drawer -->
  <div id="drawer">
    <div class="sheet-panel">
      <div class="sheet-grip"></div>
      <div class="drawer-head"><h2 id="drawerTitle">My Commutes</h2><button class="link-btn" id="drawerCloseBtn">Close</button></div>
      <div id="drawerBody"></div>
    </div>
  </div>

  <!-- Privacy notice for testers (shown until dismissed; stored in localStorage). -->
  <div id="ph-notice" role="region" aria-label="Analytics privacy notice" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;max-width:520px;margin:0 auto;z-index:9999;gap:10px;align-items:center;flex-wrap:wrap;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:12px;padding:12px 14px;font:13px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.4);">
    <span style="flex:1 1 220px;">LinkWise uses privacy-safe analytics and session replay (inputs masked, no personal data) to improve this prototype. You can decline session recording.</span>
    <button id="ph-ok" style="cursor:pointer;border:none;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;color:#0b1220;background:#22d3ee;">Got it</button>
    <button id="ph-decline" style="cursor:pointer;border:1px solid #475569;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;color:#e2e8f0;background:transparent;">Decline recording</button>
  </div>

  <script src="app.js?v=1"></script>
</body>
</html>
